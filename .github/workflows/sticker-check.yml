name: Sticker app checks
on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and essential UI
        run: node tests/check-stickers.mjs
      - name: Sync contracts and fault recovery
        run: node --test tests/*.test.mjs
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Phone browser workflows with isolated mock Drive
        run: node tests/browser-smoke.mjs
      - name: Save phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sticker-browser-results
          path: test-results/
          if-no-files-found: ignore
