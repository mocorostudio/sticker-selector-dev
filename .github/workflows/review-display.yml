name: All-candidate review display
on:
  push:
    branches: [development]
    paths: ['integration-v1/**', 'tests/review-display*', 'tests/confirmation-kit-browser.mjs', '.github/workflows/review-display.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/review-display.test.mjs
      - run: npx playwright install chromium
      - run: node tests/review-display-browser.mjs
      - run: node tests/confirmation-kit-browser.mjs
      - name: Preserve missing selections and edits in Chromium
        run: TEST_BROWSER=chromium node tests/candidate-save-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-display-phone
          path: test-results/*phone.png
          if-no-files-found: ignore
