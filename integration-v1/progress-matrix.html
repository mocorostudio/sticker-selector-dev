<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シリーズ別制作進捗 | STAMP STUDIO</title>
<style>
:root{font:16px/1.55 system-ui,-apple-system,sans-serif;color:#243d35;background:#f5f3ee}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:22px 14px 80px}
h1{font-size:clamp(24px,5vw,34px);margin:10px 0}h2{font-size:20px}p{margin:8px 0 16px}
a{color:#245c45}button,select{font:inherit;color:inherit}button{cursor:pointer;border-radius:10px;background:#fff;border:1px solid #aebdb5;padding:9px 11px;min-height:44px}
button:focus-visible,select:focus-visible{outline:3px solid #b28234;outline-offset:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}.note{color:#596e63;font-size:13px}
.matrix-wrap{overflow:auto;max-width:100%;border:1px solid #d1ddd5;border-radius:15px;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:700px}
th,td{border-right:1px solid #e2e9e4;border-bottom:1px solid #e2e9e4;text-align:center;padding:6px;min-width:120px}
th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#f1f5ee;min-width:105px;width:105px;text-align:left;font-weight:700;padding:10px}
thead th{position:sticky;top:0;background:#f1f5ee;z-index:1;white-space:nowrap}
thead th:first-child{z-index:3}tbody tr:last-child td{border-bottom:0}td:last-child,th:last-child{border-right:0}
.cell{display:flex;justify-content:center;align-items:center;width:100%;font-size:13px;min-height:58px;white-space:normal;line-height:1.3}
.cell[data-status="未確認"]{color:#67776e;background:#f7f8f6}
.cell[data-status="企画済"]{background:#f6f2e5}
.cell[data-status="生成中"],.cell[data-status="生成済"],.cell[data-status="選抜中"]{background:#e7f1fc}
.cell[data-status="検品済"],.cell[data-status="40個選抜済"],.cell[data-status="ZIP完成"]{background:#e0f2e9}
.cell[data-status="申請済"]{background:#d2ead8;color:#185232;font-weight:700}
.cell[data-status="保留"],.cell[data-status="要修正"]{background:#fce7e7;color:#8b2929}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{border:1px solid #d5ded5;border-radius:12px;padding:10px 14px;background:#fff}
dialog{border:1px solid #c8d6ca;border-radius:16px;width:calc(100% - 28px);max-width:440px;padding:20px}
dialog::backdrop{background:#192b2070}label{display:block;margin:12px 0}select,textarea{width:100%;border:1px solid #acbfb0;border-radius:10px;padding:10px;background:#fff}textarea{min-height:76px;font:inherit}
.primary{background:#245c45;border-color:#245c45;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}
small{color:#617366}.status{font-weight:600}.eyebrow{font-size:12px;letter-spacing:.12em;color:#587066;font-weight:700}
</style></head><body><main>
<a href="progress.html">← 全体の進捗画面に戻る</a><p class="eyebrow">STAMP STUDIO · SERIES BOARD</p>
<h1>キャラ × シリーズ制作進捗</h1>
<p>縦にキャラクター、横にシリーズ。各マスを押すと進捗とメモを変更できます。</p>
<div class="toolbar"><label for="filter">表示を絞る</label><select id="filter"><option value="all">全部</option><option value="active">作業中だけ</option><option value="submitted">申請済みだけ</option></select><button id="export">控えをJSONで保存</button></div>
<div class="stats" id="stats" aria-live="polite"></div>
<p class="note" id="saveStatus" role="status">この表は端末内の独立した控えです。Driveの正本や選抜データには自動反映しません。未確認を未着手・完成とみなしません。</p>
<div class="matrix-wrap"><table aria-label="キャラクターとシリーズの進捗"><thead><tr><th scope="col">キャラ＼シリーズ</th><th scope="col">ダジャレ①</th><th scope="col">ダジャレ②</th><th scope="col">ダジャレ③</th><th scope="col">冬</th><th scope="col">家庭内連絡</th></tr></thead><tbody id="matrix"></tbody></table></div>
<p class="note">「検品済」は技術検品の実記録を照合した場合だけ選んでください。「申請済」はLINEへの実際の申請後に設定してください。</p>
<dialog id="editor"><form method="dialog" id="form"><h2 id="title"></h2><label>現在の状態<select id="stage"></select></label><label>メモ（任意）<textarea id="memo" maxlength="1000" placeholder="次にすること、ZIPの保存先、未確認事項など"></textarea></label><small id="updated"></small><p class="actions"><button type="submit" value="save" class="primary">このマスを保存</button><button type="submit" value="cancel">キャンセル</button></p></form></dialog>
</main><script type="module">
const characters=['アザラシ','ウォンバット','たぬき','赤ちゃん','ペンギン','羊'];
const themes=['ダジャレ①','ダジャレ②','ダジャレ③','冬','家庭内連絡'];
const statuses=['未確認','未着手','企画済','生成中','生成済','検品済','選抜中','40個選抜済','ZIP完成','申請済','保留','要修正'];
const KEY='animal-stickers-series-progress/v1';
const $=id=>document.getElementById(id);
let entries={};try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');if(old&&typeof old==='object'&&!Array.isArray(old))entries=old;}catch{$('saveStatus').textContent='保存済みの控えを読み取れません。元データは削除せず、新規の表示をしています。';}
const id=(c,t)=>c+'｜'+t;
let editing=null;
for(const s of statuses){const o=document.createElement('option');o.value=s;o.textContent=s;$('stage').append(o);}
function render(){
 const body=$('matrix');body.replaceChildren();let submitted=0,known=0,visible=0;
 const filter=$('filter').value;
 for(const c of characters){const row=document.createElement('tr'),head=document.createElement('th');head.scope='row';head.textContent=c;row.append(head);let show=false;
  for(const t of themes){const k=id(c,t),r=entries[k]||{},s=statuses.includes(r.stage)?r.stage:'未確認',td=document.createElement('td'),b=document.createElement('button');b.className='cell';b.dataset.status=s;b.textContent=s;b.title=c+'・'+t+(r.memo?'：'+r.memo:'');b.setAttribute('aria-label',c+'、'+t+'、'+s+'。編集');b.onclick=()=>openEditor(c,t);td.append(b);row.append(td);
  if(s==='申請済')submitted++;if(s!=='未確認')known++;if(filter==='all'||(filter==='submitted'&&s==='申請済')||(filter==='active'&&s!=='未確認'&&s!=='申請済'&&s!=='未着手'))show=true;
  }
  if(show){body.append(row);visible++;}
 }
 $('stats').replaceChildren();
 for(const v of ['全30枠','確認済 '+known+'枠','申請済 '+submitted+'枠']){const p=document.createElement('span');p.className='stat';p.textContent=v;$('stats').append(p);}
 if(!visible){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=6;cell.textContent='この条件に一致するキャラクターはありません。';row.append(cell);body.append(row);}
}
function openEditor(c,t){editing={c,t};const r=entries[id(c,t)]||{};$('title').textContent=c+' × '+t;$('stage').value=statuses.includes(r.stage)?r.stage:'未確認';$('memo').value=r.memo||'';$('updated').textContent=r.updatedAt?'前回更新：'+new Date(r.updatedAt).toLocaleString('ja-JP'):'記録なし';$('editor').showModal();}
$('form').addEventListener('submit',event=>{if(event.submitter?.value!=='save'||!editing)return;event.preventDefault();const k=id(editing.c,editing.t),next={...entries,[k]:{stage:$('stage').value,memo:$('memo').value.trim(),updatedAt:new Date().toISOString()}};try{localStorage.setItem(KEY,JSON.stringify(next));entries=next;$('saveStatus').textContent='この端末に保存しました（Driveには未同期）。';$('editor').close();render();}catch(e){$('saveStatus').textContent='端末への保存に失敗しました。データを上書きせず、入力を保持しています：'+e.message;}});
$('filter').onchange=render;
$('export').onclick=()=>{const data={schema:KEY,exportedAt:new Date().toISOString(),entries};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='series-progress-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);};
render();
</script></body></html>
