<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>スタンプのセット組み直し</title><link rel="stylesheet" href="product-editor.css?v=20261108-1"></head><body><header><a href="workflow.html">元の選抜アプリへ</a><h1>スタンプを組み直す</h1><p>セット間の移動・予備との入れ替え・並べ替えができます。元の◯と検品結果は保持します。</p><button id="connect" disabled>Googleに接続して開く</button><label id="chooser" hidden>保存済みの組み直し案<select id="versions"></select></label><button id="load" hidden>この案を開く</button><p id="status" role="status" aria-live="polite">接続を準備しています…</p></header><main id="editor" hidden><section class="toolbar"><strong id="counts"></strong><label>表示する候補<select id="scope"></select></label><label>絞り込み<select id="style"><option value="">すべての演出</option><option>着ぐるみ</option><option>帽子・かぶりもの</option><option>小物</option></select></label><label>セリフ・モチーフを検索<input id="search" type="search" placeholder="ありがとう、リンゴ など"></label><label>確認背景<select id="background"><option value="white">白</option><option value="black">黒</option><option value="checker">市松</option></select></label><button id="undo">ひとつ戻す</button><button id="cancelSwap" hidden>入れ替えをやめる</button><p id="hint">画像下の移動先でセットを変更。「入れ替える」で2枚を選ぶと、40枚を保ったまま交換できます。</p></section><div id="grid"></div><nav><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></nav></main><footer id="savebar" hidden><span id="saveState">端末に自動保存</span><button id="save">組み直しをDriveに保存</button><a id="saved" hidden target="_blank" rel="noopener">保存した記録</a></footer><script type="module" src="product-editor.mjs?v=20261108-1"></script></body></html>
