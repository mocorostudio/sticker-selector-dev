<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'"><title>スタンプ切り出し v9</title><link rel="stylesheet" href="style.css"><body><main><h1>スタンプ切り出し</h1><p>候補マスターは添付v3の116候補です。本運用前にキャラ別の最新版との照合が必要です。</p><p>端末内で処理・Drive送信なし。まず画像を選び、切り出して確認します。</p><label>元画像（複数可）<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label><label>配置<select id="grid"><option value="3">3×3</option><option value="2">2×2</option><option value="4">4×4</option></select></label><label>接頭辞<input id="prefix" value="ST" maxlength="20"></label><label><input id="erase" type="checkbox">単色背景を除去する（外周と同じ色のみ・要目視）</label><button id="run">まとめて切り出す</button><button id="retry">不合格だけ再処理</button><label>確認背景<select id="background"><option value="checker">市松</option><option value="black">黒</option><option value="white">白</option></select></label><p id="status" role="status" aria-live="polite">未読込</p><button id="backup">作業をバックアップ</button><label>バックアップから復帰<input id="restore" type="file" accept="application/json"></label><button id="manifest">連携JSONを保存</button><div id="cards"></div><p>自動検査だけでは合格になりません。実画像とマスターを照合し、全項目を確認してください。</p></main><script type="module" src="app.mjs"></script></body></html>
