<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修正済みZIPの並べ替え</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#243329;background:#faf9f6}body{margin:auto;max-width:680px;padding:16px 12px 80px}h1{font-size:21px}p{line-height:1.6}button,.filepick{font:inherit;min-height:44px;padding:9px 12px;border:2px solid #b2c7b8;border-radius:10px;background:white;color:#143a28}button:disabled{opacity:.4}button:focus-visible,.filepick:focus-within{outline:3px solid #b57d00}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}.filepick{display:block;position:relative;width:100%;box-sizing:border-box;text-align:center;background:#175e40;color:white;font-weight:700;cursor:pointer}.filepick:focus-within{outline:3px solid #e7a52b;outline-offset:2px}.notice{background:#eff5ee;padding:12px;border-radius:10px}.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #c8d8cb}.row img{width:96px;height:84px;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,white 0 50%) 50%/16px 16px}.row strong{min-width:28px}.row .actions{margin-left:auto;display:flex;gap:5px}.row button{min-width:44px}.artwork{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.artwork figure{margin:0}.artwork img{display:block;max-width:240px;max-height:240px;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,white 0 50%) 50%/16px 16px}.artwork .tab{width:192px;height:148px;object-fit:contain}#save{width:100%;background:#175e40;color:white;font-weight:700;margin-top:15px}#status{white-space:pre-wrap;overflow-wrap:anywhere}.reorder-tools{position:sticky;top:0;z-index:5;background:#faf9f6;border:1px solid #b7c9bc;border-radius:10px;padding:10px;margin:8px 0}.reorder-tools p{margin:3px 0 9px;font-weight:700}.reorder-tools button{margin:2px;font-size:14px}.reorder-tools[hidden]{display:none}#items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.reorder-card{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:8px 3px;border:2px solid #b2c7b8;border-radius:10px;background:white;color:#143a28;overflow-wrap:anywhere}.reorder-card img{display:block;width:100%;aspect-ratio:370/320;object-fit:contain;background:repeating-conic-gradient(#ddd 0 25%,white 0 50%) 50%/16px 16px}.reorder-card[aria-pressed=true]{border:4px solid #175e40;background:#d8f3e2;box-shadow:inset 0 0 0 2px white}.reorder-card strong{font-size:17px}.reorder-card small{font-size:12px;line-height:1.3}.reorder-card:focus-visible{outline:3px solid #dfab29}#save{position:sticky;bottom:6px;z-index:6}#save[aria-busy=true]{background:#375e49;color:#fff}#save[aria-busy=true]::before{content:'';display:inline-block;width:16px;height:16px;border:3px solid #a2cdb2;border-top-color:#fff;border-radius:50%;vertical-align:-4px;margin-right:8px;animation:save-spin .9s linear infinite}@keyframes save-spin{to{transform:rotate(360deg)}}#saveProgress{position:sticky;bottom:60px;z-index:6;background:#eef6f0;border:1px solid #97bba3;border-radius:9px;padding:9px 12px;font-weight:700}#saveProgress[hidden]{display:none}@media(prefers-reduced-motion:reduce){#save[aria-busy=true]::before{animation:none}}</style>
<h1>修正済みZIPの並べ替え</h1><p><a href="workflow.html">← 統合アプリに戻る</a></p>
<p class="notice">あかさが修正した申請用ZIPを読み込み、画像をそのまま保って順番だけ変更します。メイン・タブは元のPNGを変更せず引き継ぎます。元のZIPや選抜履歴は変更しません。</p>
<label class="filepick" for="file">申請用ZIPを選ぶ<input id="file" type="file" accept=".zip,application/zip" aria-label="申請用ZIPファイル"></label>
<p id="status" role="status">40枚＋main.png＋tab.pngのZIPを選んでください。</p>
<section id="editor" hidden><h2>メイン・タブ（変更しません）</h2><div class="artwork"><figure><figcaption>メイン 240×240</figcaption><img id="main" alt="メイン画像"></figure><figure><figcaption>タブ 96×74（2倍プレビュー）</figcaption><img class="tab" id="tab" alt="タブ画像"></figure></div><h2>スタンプの並び順</h2><p>① 動かしたい画像をタップ → ② 入れたい位置の画像をタップ。その画像の直前に入ります。</p><div id="reorderTools" class="reorder-tools"><p id="moveStatus" role="status">移動する画像を選んでください。</p><button id="moveFirst" hidden>先頭へ</button><button id="moveLast" hidden>最後へ</button><button id="moveCancel" hidden>選択をやめる</button><button id="undoMove" disabled>1つ戻す</button></div><div id="items"></div><label for="folder">キャラ専用フォルダのDrive URL（04_申請用の親フォルダ）</label><input id="folder" type="url" placeholder="https://drive.google.com/drive/folders/..." style="box-sizing:border-box;width:100%;min-height:44px;font-size:16px" autocomplete="off"><p id="saveProgress" role="status" aria-live="polite" hidden></p><button id="save">この順番で04_申請用に保存</button><p id="saveResult" role="status"></p></section>
<script type="module">
import {storedZip} from './submission-zip.mjs';
import {googleTestAuth} from './google-auth.mjs';
import {digest} from './drive-export.mjs';
const auth=googleTestAuth();
function progress(message){$('saveProgress').hidden=false;$('saveProgress').textContent=message;$('status').textContent=message;}
function saveButton(active){$('save').disabled=active;$('save').setAttribute('aria-busy',String(active));$('save').textContent=active?'保存処理中…（画面を閉じないでください）':'この順番で04_申請用に保存';}
const $=id=>document.getElementById(id);let entries=[],art={},urls=[],busy=false,selected=null,undo=[];
const u16=(v,o)=>v.getUint16(o,true),u32=(v,o)=>v.getUint32(o,true);
async function extract(blob){
 const bytes=new Uint8Array(await blob.arrayBuffer());if(bytes.length>60000000)throw Error('ZIPが60MBを超えます。');const v=new DataView(bytes.buffer),min=Math.max(0,bytes.length-65557);let end=-1;
 for(let p=bytes.length-22;p>=min;p--)if(u32(v,p)===0x06054b50){end=p;break;}if(end<0)throw Error('ZIPの終端を確認できません。');
 const count=u16(v,end+10),central=u32(v,end+16);if(count!==42)throw Error('40枚のスタンプとmain.png、tab.pngの合計42ファイルが必要です。');
 let pos=central;const result=new Map(),decoder=new TextDecoder();
 for(let n=0;n<count;n++){
  if(pos+46>bytes.length||u32(v,pos)!==0x02014b50)throw Error('ZIPの索引が壊れています。');
  const method=u16(v,pos+10),compressed=u32(v,pos+20),uncompressed=u32(v,pos+24),nameSize=u16(v,pos+28),extra=u16(v,pos+30),comment=u16(v,pos+32),offset=u32(v,pos+42),name=decoder.decode(bytes.slice(pos+46,pos+46+nameSize));
  pos+=46+nameSize+extra+comment;
  if(!/^(?:0[1-9]|[1-3][0-9]|40|main|tab)\.png$/.test(name)||result.has(name)||uncompressed>15000000)throw Error('ZIPに不正なファイル名やサイズ、重複があります。');
  if(offset+30>bytes.length||u32(v,offset)!==0x04034b50)throw Error('ZIP内ファイルが壊れています。');
  const start=offset+30+u16(v,offset+26)+u16(v,offset+28);if(start+compressed>bytes.length)throw Error('ZIPデータが途中で切れています。');
  const data=bytes.slice(start,start+compressed);let raw;
  if(method===0)raw=data;else if(method===8){if(typeof DecompressionStream==='undefined')throw Error('この端末では圧縮ZIPの解凍に対応していません。');const ds=new DecompressionStream('deflate-raw');raw=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer());}
  else throw Error('未対応のZIP圧縮形式です。');
  if(raw.length!==uncompressed||raw[0]!==137||raw[1]!==80||raw[2]!==78||raw[3]!==71)throw Error(name+'のPNG内容が不正です。');
  result.set(name,new Blob([raw],{type:'image/png'}));
 }
 return result;
}
async function verify(name,blob,width,height){
 const image=await createImageBitmap(blob);try{if(image.width!==width||image.height!==height)throw Error(name+'の寸法が異なります（'+image.width+'×'+image.height+'）。');}finally{image.close();}
}
function url(blob){const result=URL.createObjectURL(blob);urls.push(result);return result;}
function render(){const host=$('items'),scroll=window.scrollY;host.replaceChildren();
 const active=selected!==null&&entries.includes(selected),index=active?entries.indexOf(selected):-1;
 $('moveStatus').textContent=active?'移動中：'+String(index+1).padStart(2,'0')+'番。入れたい位置をタップしてください。':'移動する画像を選んでください。';
 for(const id of ['moveFirst','moveLast','moveCancel'])$(id).hidden=!active;
 $('undoMove').disabled=busy||!undo.length;
 for(const [i,e] of entries.entries()){
  const card=document.createElement('button');card.className='reorder-card';card.disabled=busy;card.setAttribute('aria-pressed',String(active&&e===selected));card.setAttribute('aria-label',active?(e===selected?'移動を取り消す':String(i+1)+'番の前に移動'):String(i+1)+'番を移動する');
  const num=document.createElement('strong');num.textContent=String(i+1).padStart(2,'0');const img=document.createElement('img');img.src=e.preview;img.alt=String(i+1)+'番のスタンプ';const hint=document.createElement('small');hint.textContent=active?(e===selected?'✓ 選択中':'この前に入れる'):'移動する';card.append(num,img,hint);
  card.onclick=()=>{if(busy)return;if(!active){selected=e;render();return;}if(e===selected){selected=null;render();return;}move(entries.indexOf(e));};host.append(card);
 }
 window.scrollTo(0,scroll);
}
function move(target){if(!selected||busy)return;const before=entries.indexOf(selected);if(before<0)return;const snapshot=[...entries];entries.splice(before,1);const index=target>before?target-1:target;entries.splice(Math.max(0,Math.min(entries.length,index)),0,selected);selected=null;if(entries.some((e,i)=>e!==snapshot[i]))undo.push(snapshot);render();}
$('moveFirst').onclick=()=>move(0);
$('moveLast').onclick=()=>move(entries.length);
$('moveCancel').onclick=()=>{selected=null;render();};
$('undoMove').onclick=()=>{if(!undo.length||busy)return;entries=undo.pop();selected=null;render();};
$('file').addEventListener('change',async()=>{const file=$('file').files?.[0];if(!file)return;$('editor').hidden=true;entries=[];art={};selected=null;undo=[];urls.forEach(URL.revokeObjectURL);urls=[];$('status').textContent='ZIPの42画像を検査しています…';try{const map=await extract(file);for(let i=1;i<=40;i++){const name=String(i).padStart(2,'0')+'.png',blob=map.get(name);if(!blob)throw Error(name+'がありません。');await verify(name,blob,370,320);entries.push({blob,preview:url(blob)});}for(const [name,w,h] of [['main.png',240,240],['tab.png',96,74]]){const blob=map.get(name);if(!blob)throw Error(name+'がありません。');await verify(name,blob,w,h);art[name]=blob;}$('main').src=url(art['main.png']);$('tab').src=url(art['tab.png']);render();$('editor').hidden=false;$('status').textContent='42枚を読み込みました。順番を変更できます。メイン・タブは元の修正済みPNGです。';}catch(error){entries=[];$('status').textContent='読込を中止しました：'+error.message;}});
function folderIdFromUrl(value){let u;try{u=new URL(value.trim());}catch{throw Error('キャラフォルダのDrive URLを入力してください。');}if(u.origin!=='https://drive.google.com'||u.pathname.split('/').length!==4||u.pathname.split('/')[1]!=='drive'||u.pathname.split('/')[2]!=='folders'||!u.pathname.split('/')[3]||!/^[a-zA-Z0-9_-]+$/.test(u.pathname.split('/')[3]))throw Error('キャラフォルダのDrive URLが不正です。');return u.pathname.split('/')[3];}
async function driveRequest(url,token,options={}){const r=await fetch(url,{...options,headers:{...options.headers,Authorization:'Bearer '+token},signal:AbortSignal.timeout(120000)});if(!r.ok)throw Error('Drive通信エラー（'+r.status+'）。保存済みの可能性があるため同じ内容で照合してください。');return r;}
async function inspectFolder(parent,token){const api='https://www.googleapis.com/drive/v3/files',meta=await driveRequest(api+'/'+encodeURIComponent(parent)+'?fields=id,name,mimeType,trashed',token).then(r=>r.json());if(meta.trashed||meta.mimeType!=='application/vnd.google-apps.folder')throw Error('キャラフォルダを確認できません。');
 const q="'"+parent+"' in parents and name = '04_申請用' and mimeType = 'application/vnd.google-apps.folder' and trashed = false";
 const found=await driveRequest(api+'?'+new URLSearchParams({q,fields:'files(id,name,parents,mimeType,trashed),nextPageToken',pageSize:'100'}),token).then(r=>r.json());if(found.files?.length!==1||found.files[0].parents?.[0]!==parent)throw Error('04_申請用のフォルダが一意に確認できません。');return {characterName:meta.name,id:found.files[0].id};}
async function saveToDrive(blob,name,sha,folder,token){const api='https://www.googleapis.com/drive/v3/files',q="'"+folder+"' in parents and name = '"+name+"' and trashed = false";
 const existing=await driveRequest(api+'?'+new URLSearchParams({q,fields:'nextPageToken,files(id,name,size,appProperties,parents,md5Checksum,webViewLink)',pageSize:'100'}),token).then(r=>r.json());
 if(existing.nextPageToken)throw Error('同名ファイルが多すぎるため自動保存を中止しました。');
 if(existing.files?.length){const match=existing.files.find(x=>x.appProperties?.sha256===sha&&Number(x.size)===blob.size&&x.parents?.[0]===folder);if(match)return {file:match,reused:true};throw Error('同じファイル名が別の内容で存在します。上書きしません。');}
 const boundary='stickerUpload'+crypto.randomUUID().replaceAll('-',''),json=JSON.stringify({name,mimeType:'application/zip',parents:[folder],appProperties:{sha256:sha,source:'reordered-application',imageCount:'40',hasMainTab:'true'}});
 const crlf=String.fromCharCode(13,10);const payload=new Blob(['--'+boundary+crlf+'Content-Type: application/json; charset=UTF-8'+crlf+crlf+json+crlf+'--'+boundary+crlf+'Content-Type: application/zip'+crlf+crlf,blob,crlf+'--'+boundary+'--'+crlf],{type:'multipart/related; boundary='+boundary});
 const r=await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,parents,appProperties,webViewLink',token,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body:payload});const created=await r.json();
 const checked=await driveRequest(api+'/'+created.id+'?fields=id,name,size,parents,appProperties,webViewLink,trashed',token).then(r=>r.json());
 if(checked.trashed||checked.name!==name||checked.parents?.length!==1||checked.parents[0]!==folder||Number(checked.size)!==blob.size||checked.appProperties?.sha256!==sha)throw Error('Driveへ送信しましたが、保存後の照合が未完了です。再送信せずフォルダを確認してください。');
 return {file:checked,reused:false};}
$('save').onclick=async()=>{if(busy||entries.length!==40)return;let folder;try{folder=folderIdFromUrl($('folder').value);}catch(e){$('status').textContent=e.message;return;}
 busy=true;saveButton(true);const snapshot=[...entries];progress('①／④ Google認証を確認中…');$('saveResult').textContent='';
 // Start OAuth synchronously from user click (popup blockers on iOS).
 const tokenPromise=auth.getToken();
 try{const token=await tokenPromise;progress('②／④ 保存先フォルダを確認中…');const target=await inspectFolder(folder,token);
 progress('③／④ ZIP作成・40枚の順番と内容を照合中…');
 const list=snapshot.map((e,i)=>({name:String(i+1).padStart(2,'0')+'.png',blob:e.blob}));list.push({name:'main.png',blob:art['main.png']},{name:'tab.png',blob:art['tab.png']});
 const zip=await storedZip(list,{includeArtwork:true});if(zip.size>60000000)throw Error('ZIPが60MBを超えています。');
 const actual=await extract(zip);for(const entry of list){const recovered=actual.get(entry.name);if(!recovered||await digest(recovered)!==await digest(entry.blob))throw Error(entry.name+'の保存時の順番・内容が一致しません。');}
 const sha=await digest(zip),filename='REORDERED_application_40_'+sha.slice(0,12)+'.zip';
 progress('④／④ '+target.characterName+'／04_申請用 に送信・保存確認中…');
 const saved=await saveToDrive(zip,filename,sha,target.id,token);
 progress('✓ Driveへの保存を確認しました。40枚＋main.png＋tab.png、全42枚を照合済み。');
 const link=document.createElement('a');link.href=saved.file.webViewLink||'https://drive.google.com/file/d/'+saved.file.id+'/view';link.target='_blank';link.rel='noopener noreferrer';link.textContent='Driveの新しい申請用ZIPを開く';
 $('saveResult').replaceChildren(document.createTextNode((saved.reused?'同じ内容の保存済みZIPを確認：':'新規保存：')+filename+' ／ 保存先：'+target.characterName+'／04_申請用 ／ ファイルID：'+saved.file.id+' '),link);
 }catch(e){progress('保存未確認：'+e.message+'。元のZIPは変更していません。');}
 finally{busy=false;saveButton(false);render();}};

</script></html>
