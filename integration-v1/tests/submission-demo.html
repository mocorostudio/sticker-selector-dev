<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../app.css?v=20261023-merge1"><title>申請用の選択・合成画像テスト</title><body><p style="background:#fff2ba;padding:12px">合成画像での操作テストです。Google Driveは変更しません。</p><nav class="workflow-tabs"></nav><script type="module">
import {initSubmission} from '../submission-ui.mjs?v=20261023-merge1';
import {validateSubmission} from '../submission-core.mjs?v=20261023-merge1';
const data=Array.from({length:17},(_,i)=>({id:'demo'+i,name:'DEMO_'+String(i+1).padStart(2,'0')+'.png',mimeType:'image/png',parents:['demo-adopted'],size:'100',md5Checksum:'demo'+i,version:'1'}));
const demoDrive={load:async()=>({character:{id:'demo-character',name:'合成テスト'},files:structuredClone(data)}),image:async file=>{const c=document.createElement('canvas');c.width=370;c.height=320;const ctx=c.getContext('2d');ctx.fillStyle='#ffcb77';ctx.beginPath();ctx.arc(185,150,85,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18302c';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText(file.name.slice(5,7),185,165);return new Promise(resolve=>c.toBlob(resolve,'image/png'));},move:async(op,{onProgress})=>{validateSubmission(op);for(let i=0;i<op.entries.length;i++){onProgress({done:i,total:op.entries.length});await new Promise(r=>setTimeout(r,15));}for(const e of op.entries){const i=data.findIndex(x=>x.id===e.fileId);if(i>=0)data.splice(i,1);}onProgress({done:op.entries.length,total:op.entries.length});return {count:op.entries.length,sets:op.sets.map(s=>({name:s.name,count:s.target,link:'#demo-'+s.id}))};}};
const result=initSubmission({items:()=>[{crop:{driveSource:{fileId:'demo-source'}}}]},{authFactory:()=>({ready:Promise.resolve(),disconnect(){},getToken:async()=> 'synthetic'}),driveFactory:()=>demoDrive,lookupFactory:()=>({character:async()=>({id:'demo-character',name:'合成テスト'})})});result.host.hidden=false;
</script></body></html>
