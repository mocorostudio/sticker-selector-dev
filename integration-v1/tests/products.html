<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../app.css"><body data-local-workflow="true"><nav class="workflow-tabs"></nav><script type="module">
import {initSubmission} from '../submission-ui.mjs';
import {submissionKey} from '../submission-store.mjs';
const blobs=new Map();
const items=Array.from({length:243},(_,i)=>({id:'local'+i,imageId:'image'+i,candidate:'C'+i,name:'image'+i+'.png',phrase:'候補'+i,characterId:'char',origin:'crop-local',touched:true,rating:'o',technicalPassed:false}));
for(const [i,item] of items.entries()){const c=document.createElement('canvas');c.width=370;c.height=320;const ctx=c.getContext('2d');ctx.fillStyle=`rgb(${i%256},${Math.floor(i/256)},80)`;ctx.fillRect(60,60,200,180);const png=await new Promise(r=>c.toBlob(r));blobs.set(item.id,png);const sha=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await png.arrayBuffer()))).map(x=>x.toString(16).padStart(2,'0')).join('');item.crop={reviewDisplay:true,pendingDrive:{characterId:'char',archiveFileId:'synthetic-archive',manifestFileId:'synthetic-manifest',sha256:sha},displayReview:{sha256:sha,imageId:item.imageId,candidateId:item.candidate,phrase:item.phrase,pose:item.pose,status:'unknown',reason:'隔離テスト用・技術承認なし'}};}
window.currentItems=items.slice(0,81);window.allItems=items;window.savedArchives=[];
const key=submissionKey(location.pathname,'char',true);window.productKey=key;
if(!localStorage.getItem(key))localStorage.setItem(key,JSON.stringify({draft:{sets:[{id:'one',name:'商品1',target:40}],assignments:Object.fromEntries(items.slice(0,40).map(x=>[x.imageId,'one'])),seenCandidateIds:items.slice(0,81).map(x=>x.imageId),orders:{one:items.slice(0,40).reverse().map(x=>x.imageId)},artwork:{one:{mainId:'image0',tabId:'image1',strokes:[]}}},operation:null}));
const screen=initSubmission({items:()=>window.allItems,visible:()=>window.currentItems,ready:Promise.resolve(),characterId:()=> 'char',get:async id=>blobs.get(id),decode:async blob=>{const b=await createImageBitmap(blob),ctx=document.createElement('canvas').getContext('2d');ctx.canvas.width=b.width;ctx.canvas.height=b.height;ctx.drawImage(b,0,0);b.close();return ctx.getImageData(0,0,ctx.canvas.width,ctx.canvas.height);}},{authFactory:()=>({ready:Promise.resolve(),getToken:async()=> 'synthetic'}),lookupFactory:()=>({account:async()=>({permissionId:'synthetic'}),saveArchives:async bundle=>{window.savedArchives.push(await Promise.all(bundle.archives.map(async a=>({count:a.count,bytes:Array.from(new Uint8Array(await a.blob.arrayBuffer()))})))) ;return {archives:bundle.archives.map((a,i)=>({id:'synthetic'+i,link:'#synthetic',count:a.count}))};}})});
screen.host.hidden=false;screen.open();window.productsReady=true;
</script></body></html>
