<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>動物LINEスタンプ選抜 v9 開発版</title><link rel="stylesheet" href="app.css?v=20261020-bottom1"></head><body>
<header><h1>動物LINEスタンプ選抜 v9</h1><p id="mode" class="muted">開発版：実Drive同期は未有効</p><div class="controls actions"><button class="primary" id="loadPending">未選抜を読み込む</button><button class="primary" id="sync">選抜確定・Drive同期</button></div><p id="driveStatus" role="status" aria-live="polite">初期◯は未選抜です。選抜確定までDriveは変更しません。</p><div id="status" role="status">読み込み中…</div><p id="error" role="alert"></p>
<details><summary>背景・読み込み・結果保存</summary><div class="controls"><label class="filebtn">PNG・ZIPを読み込む<input id="files" type="file" multiple accept=".png,.zip,image/png,application/zip"></label><select id="background" aria-label="背景"><option value="checker">市松背景</option><option value="white">白背景</option><option value="black">黒背景</option></select><select id="importMode" aria-label="読み込み方法"><option value="replace">入れ替え</option><option value="append">追加</option></select><button id="showAll">保存済みをすべて表示</button><button id="setAll">表示中を全件◯</button><button id="json">全選抜結果JSONを保存</button><button id="disconnect" hidden>Google接続を解除</button><button id="csv">全選抜結果CSVを保存</button></div><p class="muted">入れ替えは表示だけを変更します。画像・評価は保持します。端末内データはJSONで保存できます。</p></details></header>
<main class="list" id="list"></main><footer id="syncBar" aria-label="選抜の確定"><p id="syncCount" role="status">確定する画像：0枚</p></footer><dialog id="zoom"><button id="close">閉じる</button><div><img id="zoomimg" alt="拡大画像"></div></dialog><script type="module" src="app.mjs?v=20261020-bottom1"></script></body></html>
